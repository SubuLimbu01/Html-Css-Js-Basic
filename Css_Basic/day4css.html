<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        ul.a {
            list-style-type: square;
            list-style-position: inside;
        }

        ul.b {
            list-style-type: decimal;
            list-style-position: outside;
        }

        ol.c {
            list-style-type: upper-latin;
            list-style-position: inside;
        }

        ol.d {
            list-style-type: upper-roman;
            list-style-position: outside;
        }

        table,
        th,
        td {
            border: 3px, solid, black;
            padding: 10px;
            border-color: green;
            border-spacing: 10px;
            height: 70px;
            width: 70px;
            /* text-align: center; */
            vertical-align: middle;
        }

        ul.hi {
            list-style-type: none;
            margin: 0;
            padding: 0;
        }

        li {
            display: block;
        }

        ol.hmm {
            list-style-type: none;
            margin: 0;
            padding: 0;
        }

        li {
            display: inline;
        }
    </style>

</head>

<body>

    <ul class="a">
        <li>coke</li>
        <li>juice</li>
        <li>coffee</li>
    </ul>

    <ul class="b">
        <li>Momo</li>
        <li>Noodles</li>
        <li>Rice</li>
    </ul>

    <ol class="c">
        <li>Car</li>
        <li>Bike</li>
        <li>cycle</li>
    </ol>

    <ol class="d">
        <li>Nisna</li>
        <li>Subu</li>
        <li>Bikram</li>
    </ol>

    <br>
    <hr>


    <!-- tables -->
    <h1>This is table </h1>

    <table>
        <tr>
            <th>Name</th>
            <td>Subu</td>
            <td>Nabina</td>
            <td>Sagun</td>
        </tr>
        <tr>
            <th>Class</th>
            <td>10</td>
            <td>12</td>
            <td>9</td>
        </tr>
        <TR>
            <th>Mark</th>
            <td>98</td>
            <td>87</td>
            <td>92</td>
        </TR>
    </table>

    <br>
    <hr>

    <!-- display -->

    <h1>Block display</h1>

    <ul class="hi">
        <li><a href="https://www.youtube.com/">Youtube</a></li>
        <li><a href="https://kisskh.do/">kisskh</a></li>
    </ul>

    <h1>Inline display</h1>
    <ol class="hmm">
        <li><a href="https://www.youtube.com/">youtube</a></li>
        <li><a href="https://kisskh.do/">kisskh</a></li>
    </ol>




























































































































































































































































</body>

</html>
