<!doctype html>
<html lang="en">

    <title>Document</title>
    <style>
      h1 {

      }

    <script>
      function myfunction() {
        document.getElementById("ki").innerHTML = "Javascript coder";
      }
    </script>
  </head>

    <h1>Javascript output</h1>

      "

    <h4 id="ki">What coder?</h4>
    <button type="button" onclick="myfunction()">Hello there!</button>

    <br />

    <button type="button" onclick="document.write(3 + 7)" ;>Try once!</button>

    <script>
      window.alert(9 + 4);

    <script>
      alert(2 + 1);

    <br />

</html>
