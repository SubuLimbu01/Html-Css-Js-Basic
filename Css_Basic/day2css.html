<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="cssfilestyling.css">
    <style>
        h1 {
            border: 4px,solid,black;
            margin:20px;
            margin-top:50px;
            }
            p {
                border:2px,solid , black;
                margin-top:40px;
                padding: 50px;
                padding-left:50px;
            }
            .height {
                width: 300px;
                padding: 25px;
                box-sizing: border-box;
                background-color:green;
            }
            h2 {
                border:4px,solid,black;
                height:50%;
                width:50%;
            }
            h4{
                min-width:9%;
                max-height:9%;
                border:5px,solid,black;

            }
            .coder{
                background-color: aqua;
                border:2px,solid,black;
                margin:10%;
                padding:5%;
                text-align: center;
                width:50px;
                
            }
            
    </style>
</head>
<body>
    <!--margins-->
    <h1>This is the use of margin </h1>

   <!--padding-->
   <p>This my first use of padding in a webpage </p>

   <!--box-sizing-->
   <div class="height">
    I am using my first padding box-sizing.
   </div>

   <!--height and width-->
   <h2>Hello world i am using height and width for the first time</h2>

   <!--min/max height and width-->
    <h4>Hello everyone I am learning html css for the first time</h4>

    <!--box model-->
    <div class="coder">Welcome to rubys website</div>

    <!--css outline-->
    <div class="main">
        <div class="item">Hello welcome to speechvila 
        </div>
    </div>
    
 
   






</body>
</html>
