<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="">
   
    <style>
        body {
            background-color: aqua;
        }
        p {
            color:blue;
            text-align: center;
        }
        #target {
            color: brown;
            text-align:center;
        }
        .Pass {
            color:hotpink;
            text-align: center;
        }
        * {
            color: greenyellow;
            text-align: center;
        }
        h6, h2, p {
            color:red;
            text-align: right;
        }
        h1, p {
            color: brown;
            text-align: center;
            size: 30px;
        }
    </style>
</head>
<body>
    <!--css selectors-->
   <p> Hello welcome to my first css webpage</p> 
   <p>I hope u like it</p>

   <!--css id selectors-->
   <p id="target">Hello world</p>
   <h4>katsye garnly and touch</h4>

   <!--css classes selectors-->
   <h1 class="Pass">Name</h1>
   <p class="Pass">My name is subu  </p>

   <!---css universal selectors-->
   <h1 id="parallel">Hello world!</h1>
   <h3>This is universal selectors</h3>

   <!--css grouping selectors-->
   <h6>hi</h6>
   <h2>hi</h2>
   <p>hi</p>

   <!--internal css-->

   <h1>Hello everyone</h1>
   <p>this is my first webpage as a coder</p>

   <!--inline css-->
   <p style="color:greenyellow;">I am the youngest coder from Nepal</p>

   
   































    
</body>
</html>
